# 백엔드 CI — PR/푸시 시 Postgres 를 띄워 마이그레이션·모델 일치·pytest 를 게이트로 돌린다.
# (CLAUDE.md "검증" 섹션의 백엔드 짝)
name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sage
          POSTGRES_PASSWORD: sage
          POSTGRES_DB: sage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI 전용 값 — 실제 비밀값 아님. 테스트 DB(sage_test)는 conftest 가 이 주소에서 이름만 바꿔 쓴다
      DATABASE_URL: postgresql+psycopg://sage:sage@localhost:5432/sage
      JWT_SECRET_KEY: ci-only-not-a-secret-but-long-enough-32b
      ANTHROPIC_API_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test database
        run: PGPASSWORD=sage psql -h localhost -U sage -d sage -c 'CREATE DATABASE sage_test'

      - name: Migrate (upgrade head)
        run: alembic upgrade head

      - name: Model ↔ migration drift check
        run: alembic check

      - name: Migration round trip (downgrade base → upgrade head)
        run: alembic downgrade base && alembic upgrade head

      - name: Tests
        run: pytest -q

      # paraphrase 평가 루프 — 지금은 저장된 답(fixture)으로 채점. Day 7 이후 실제 응답을 fixture 로 저장해 기준선으로 쓴다
      - name: Paraphrase eval (fixture)
        run: python -m evals.run_paraphrase_eval --fixture evals/fixtures/sample_outputs.json
